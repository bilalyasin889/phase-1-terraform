skip-check:
  - CKV2_AWS_11   # VPC Flow Logs
  - CKV2_AWS_12   # Default Security Group restricting all traffic
  - CKV_AWS_260   # Security Group allows ingress from 0.0.0.0/0 to port 80
  - CKV2_AWS_5    # Security Groups are attached to another resource
  - CKV_AWS_378   # ALB doesn't use HTTP protocol
  - CKV2_AWS_28   # ALB has WAF enabled
  - CKV2_AWS_62   # S3 Buckets have event notifications enabled
  - CKV2_AWS_61   # S3 Buckets have lifecycle configuration
  - CKV_AWS_18    # S3 Bucket has access logging enabled
  - CKV_AWS_144   # S3 Buckets have cross-region replication enabled
  - CKV_AWS_145   # S3 Buckets are encrypted with KMS
  - CKV_AWS_337   # SSM parameters are using KMS CMK
  - CKV_AWS_158   # CloudWatch Logs are encrypted with KMS
  - CKV_AWS_161   # RDS database has IAM authentication enabled
  - CKV_AWS_157   # RDS multi-AZ deployment (for non production environments)
  - CKV_AWS_338   # CloudWatch log group retain policy is set to 365 days
quiet: true