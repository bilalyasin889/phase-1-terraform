repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml

  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.86.0
    hooks:
      - id: terraform_fmt
      - id: terraform_validate
      - id: terraform_tflint
        args:
          - "--args=--config=.tflint.hcl"

  - repo: local
    hooks:
      - id: terraform-checkov-plan
        name: Checkov Plan Scan
        entry: /bin/bash -c 'terraform plan -out=tfplan > /dev/null && terraform show -json tfplan > tfplan.json && checkov -f tfplan.json'
        language: system
        pass_filenames: false
        always_run: true